user  git git;
worker_processes 4;
worker_rlimit_nofile 65535;

events {
    use epoll;
    worker_connections  65535;
    multi_accept on;
}

http {
        server_tokens off;
        include       mime.types;
        default_type  application/octet-stream;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # URI 白名单使用完整 OSS key 作为 map 键，默认 64 字节桶无法容纳较长 URI。
        map_hash_bucket_size 256;
        map_hash_max_size 4096;

        map $http_x_forwarded_for $clientip {
                default $http_x_forwarded_for;
                ""      $remote_addr;
        }
	map $http_appversion $appversion {
       		default "";
        	"~^(.*)$" $1;
        }
	map $request_method $loggable {
        	default 1;
        	HEAD     0;
   	}

	 # 判断是否是低版本 iOS 设备
	map $http_user_agent $is_low_version_ios {
		default 0;
		# 匹配 iOS 13.x 及以下版本
		"~*(iPhone|iPad|iPod).*OS (1[0-3]|[0-9])_" 1;
	}

	geoip_country /home/git/nginx/GeoIP/GeoIP.dat;
        geoip_city /home/git/nginx/GeoIP/GeoLiteCity.dat;

        geoip2 /home/git/nginx/GeoLite2/GeoLite2-City.mmdb {
                auto_reload 5m;
                $geoip2_country_code country iso_code;
                $geoip2_region_code subdivisions 0 iso_code;
                $geoip2_region_name subdivisions 0 names en;
                $geoip2_city_name city names en;
        }

        log_format main  '$remote_addr - $remote_user [$time_local] "$request" '
                 '$request_time $request_length '
                 '$HTTP_LFKEY $HTTP_PAYKEY '
                 '$status $body_bytes_sent $request_body "$http_referer" '
                 '"$http_user_agent"';
        #log_format  main '$http_host$clientip$time_local$request_time$request$status$body_bytes_sent$http_referer$http_user_agent$request_body';
        #log_format json_log escape=json '{"realip":"$remote_addr","@timestamp":"$time_iso8601","host":"$http_host","request":"$request","req_body":"$request_body","status":"$status","size":$body_bytes_sent,"ua":"$http_user_agent","cookie":"$http_cookie","req_time":"$request_time","uri":"$uri","referer":"$http_referer","xff":"$http_x_forwarded_for","ups_status":"$upstream_status","ups_addr":"$upstream_addr","ups_time":"$upstream_response_time"}';
        log_format json_analytics escape=json '{'
                            '"msec": "$msec", ' # request unixtime in seconds with a milliseconds resolution
                            '"connection": "$connection", ' # connection serial number
                            '"connection_requests": "$connection_requests", ' # number of requests made in connection
                    '"pid": "$pid", ' # process pid
                    '"request_id": "$request_id", ' # the unique request id
                    '"request_length": "$request_length", ' # request length (including headers and body)
                    '"remote_addr": "$remote_addr", ' # client IP
                    '"remote_user": "$remote_user", ' # client HTTP username
                    '"remote_port": "$remote_port", ' # client port
                    '"time_local": "$time_local", '
                    '"time_iso8601": "$time_iso8601", ' # local time in the ISO 8601 standard format
                    '"request": "$request", ' # full path no arguments if the request
                    '"request_uri": "$request_uri", ' # full path and arguments if the request
                    '"args": "$request_body", ' # args
                    '"status": "$status", ' # response status code
                    '"body_bytes_sent": "$body_bytes_sent", ' # the number of body bytes exclude headers sent to a client
                    '"bytes_sent": "$bytes_sent", ' # the number of bytes sent to a client
                    '"http_referer": "$http_referer", ' # HTTP referer
                    '"http_user_agent": "$http_user_agent", ' # user agent
                    '"http_x_forwarded_for": "$http_x_forwarded_for", ' # http_x_forwarded_for
                    '"http_host": "$http_host", ' # the request Host: header
                    '"server_name": "$server_name", ' # the name of the vhost serving the request
                    '"request_time": "$request_time", ' # request processing time in seconds with msec resolution
                    '"upstream": "$upstream_addr", ' # upstream backend server for proxied requests
                    '"upstream_connect_time": "$upstream_connect_time", ' # upstream handshake time incl. TLS
                    '"upstream_header_time": "$upstream_header_time", ' # time spent receiving upstream headers
                    '"upstream_response_time": "$upstream_response_time", ' # time spend receiving upstream body
                    '"upstream_response_length": "$upstream_response_length", ' # upstream response length
                    '"upstream_cache_status": "$upstream_cache_status", ' # cache HIT/MISS where applicable
                    '"ssl_protocol": "$ssl_protocol", ' # TLS protocol
                    '"ssl_cipher": "$ssl_cipher", ' # TLS cipher
                    '"scheme": "$scheme", ' # http or https
                    '"request_method": "$request_method", ' # request method
                    '"server_protocol": "$server_protocol", ' # request protocol, like HTTP/1.1 or HTTP/2.0
                    '"pipe": "$pipe", ' # "p" if request was pipelined, "." otherwise
                    '"gzip_ratio": "$gzip_ratio", '
                    '"http_cf_ray": "$http_cf_ray",'
                    '"geoip_country_code": "$geoip_country_code",'
                    '"geoip_city_code": "$geoip_city",'
                    '"geoip_region_name": "$geoip_region_name",'
                    '"geoip_city": "$geoip_city",'
                    '"geoip2_country_code": "$geoip2_country_code",'
                    '"geoip2_region_code": "$geoip2_region_code",'
                    '"geoip2_region_name": "$geoip2_region_name",'
                    '"geoip2_city_name": "$geoip2_city_name"'
                    '}';

	log_format loki 'time="$time_iso8601" level=info msg="$request"';
        log_format  5xxerr  '$http_host $clientip ${request_time}s [$time_local] '
                          '"$request" $status $body_bytes_sent $request_body '
                          '"$http_referer" "$http_user_agent" "$server_addr"';
        access_log  logs/host.access.log  main;

        add_header DPOOL_HEADER $hostname;
        keepalive_timeout 1200;
        send_timeout 1200;

        client_header_buffer_size 256k;
        client_max_body_size 2048m;
        client_body_buffer_size 4m;
        client_body_timeout 1200;
        client_header_timeout 1200;
        large_client_header_buffers 4 256k;
        server_names_hash_bucket_size 256;

        open_file_cache max=65535 inactive=20s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 3;

        fastcgi_ignore_client_abort on;
        fastcgi_connect_timeout 1200;
        fastcgi_send_timeout 1200;
        fastcgi_read_timeout 1200;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 128k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_max_temp_file_size 0;

        fastcgi_temp_path /dev/shm/nginx_tmp;
        fastcgi_cache_path /dev/shm/nginx_cache levels=1:2 keys_zone=card_cache:20m inactive=5m max_size=1024m;
        fastcgi_cache_key "$request_method$host$request_uri";
        fastcgi_cache_min_uses 1;
        fastcgi_cache_bypass $cookie_nocache $arg_nocache;
        fastcgi_no_cache $cookie_nocache $arg_nocache;
        fastcgi_cache_use_stale error timeout http_500 http_404;
        fastcgi_cache_methods GET HEAD POST;

        set_real_ip_from 10.159.0.0/16;
        set_real_ip_from 10.158.0.0/16;
        set_real_ip_from 10.49.0.0/16;
        set_real_ip_from 10.109.0.0/16;
        set_real_ip_from 10.97.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        gzip on;
        #gzip_flush_mode SYNC_FLUSH;
        gzip_min_length 1k;
        gzip_buffers 4 16k;
        gzip_http_version 1.1;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/xml application/javascript application/x-javascript application/json image/svg+xml;
        gzip_vary on;

        proxy_redirect off;
        chunked_transfer_encoding off;
        proxy_ignore_client_abort on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $clientip;
        proxy_set_header REMOTE-HOST $clientip;
        proxy_set_header X-Forwarded-For $clientip;
        proxy_connect_timeout 1200;
        proxy_send_timeout 1200;
        proxy_read_timeout 1200;
        proxy_buffer_size 512k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 1024k;
        proxy_max_temp_file_size 512m;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        fastcgi_param GEOIP_COUNTRY_CODE $geoip_country_code;
        fastcgi_param GEOIP_COUNTRY_CODE3 $geoip_country_code3;
        fastcgi_param GEOIP_COUNTRY_NAME $geoip_country_name;

        include /home/git/nginx/conf.d/*.conf;
}
