server {
    listen 80;
    server_name anytoken.work www.anytoken.work;
    return 301 https://anytoken.work$request_uri;
}

server {
    listen 443 ssl;
    server_name www.anytoken.work;

    ssl_certificate /home/git/nginx/ssl/anytoken.work/anytoken.work.pem;
    ssl_certificate_key /home/git/nginx/ssl/anytoken.work/anytoken.work.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://anytoken.work$request_uri;
}

server {
    listen 443 ssl;
    server_name anytoken.work;

    access_log /home/git/logs/anytoken.work.log json_analytics;
    error_log /home/git/logs/anytoken.work.error.log;

    ssl_certificate /home/git/nginx/ssl/anytoken.work/anytoken.work.pem;
    ssl_certificate_key /home/git/nginx/ssl/anytoken.work/anytoken.work.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # Public model gateway routes are served only by api.anytoken.work.
    location ~ ^/(?:v1(?:/|$)|v1beta(?:/|$)|openai/v1(?:/|$)|responses(?:/|$)|alpha/search(?:/|$)|models/?$|messages/count_tokens/?$|backend-api/codex(?:/|$)|chat/completions/?$|embeddings/?$|images(?:/|$)|videos(?:/|$)|tts/?$|stt/?$|custom-voices(?:/|$)|realtime/?$|web_search/?$|x_search/?$|antigravity(?:/|$)) {
        default_type application/json;
        return 404 '{"error":{"type":"not_found_error","message":"Model API is available at https://api.anytoken.work"}}';
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8080;
    }
}
