server {
    listen 80;
    server_name doc.anytoken.work;

    root /home/git/nginx/html/doc.anytoken.work;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://doc.anytoken.work$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name doc.anytoken.work;

    root /home/git/nginx/html/doc.anytoken.work;
    index index.html;

    access_log /home/git/logs/doc.anytoken.work.log json_analytics;
    error_log /home/git/logs/doc.anytoken.work.error.log;

    ssl_certificate /etc/letsencrypt/live/doc.anytoken.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doc.anytoken.work/privkey.pem;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        expires -1;
    }

    location ~ ^/(?:\.|README\.md$) {
        return 404;
    }

    location ~* \.(?:css|js|svg|png|woff2)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
